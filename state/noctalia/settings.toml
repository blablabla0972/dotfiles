config_version = 15

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "media_main" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.media_main]
    box_height = 170.0
    box_width = 420.0
    cx = 260.0
    cy = 820.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.media_main.settings]
        album_art_background = true
        album_art_blur = 32
        audio_visualizer = true
        background = true
        background_color = "surface"
        background_opacity = 0.92000000000000004
        background_padding = 14.0
        background_radius = 22.0
        color = "on_surface"
        hide_when_no_media = true
        layout = "horizontal"
        shadow = true

[location]
address = ""
auto_locate = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
telemetry_enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
enabled = false
fill_mode = "fit"

    [wallpaper.default]
    path = "/home/admin/Ảnh/Wallpaper/image-from-rawpixel-id-3864331-original.jpg"

    [wallpaper.last]
    path = "/home/admin/Ảnh/Wallpaper/image-from-rawpixel-id-3864331-original.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/admin/Ảnh/Wallpaper/image-from-rawpixel-id-3864331-original.jpg"