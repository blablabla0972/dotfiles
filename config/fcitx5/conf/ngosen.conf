# BracketTransform=Disabled
# Enable Macro
# EnableMacro=True
# Capitalize Macro
# CapitalizeMacro=True
# Key to Keep the Word as Typed
# LockWordModifier=Ctrl
# Auto capitalize after sentence-ending punctuation (. ! ? Enter)
# AutoCapitalizeAfterPunctuation=False
# Capitalize the first letter of the text or of a line
# CapitalizeStartOfText=False
# Double Space to Period
# DoubleSpaceToPeriod=False
# Double Hyphen to Em-Dash (--)
# DoubleHyphenToEmDash=False
# Retype text typed before switching on
# RetypeAfterSwitch=True
# Change the tone of a selected word
# RetoneSelection=True
# Type a word that starts with / as is
# RawWordAfterSlash=True
# Suggest emoji while typing
# EmojiSuggestions=True
# Yahoo Messenger emoticons
# YahooEmoticons=True
# English keywords
# EnglishEmojiKeywords=True
# Put a picked emoji
# EmojiPlacement="After the word"
# Offer emoji
# EmojiOfferAt="At the end of a sentence"
# Auto Restore Invalid Words
# AutoNonVnRestore=True
# Use oà, uý (Instead Of òa, úy)
# ModernStyle=True
# Allow Type With More Freedom
# FreeMarking=True
# Allow dd To Produce đ When Auto Restore Invalid Words Is On
# DdFreeStyle=True
# Backspace Removes the Tone Mark
# BackspaceRemovesTone=False
# Experiment: after forwarded backspaces, wait for the surrounding-text event instead of sleeping
# WaitSurroundingEvent=True
# Experiment: timeout (ms) for that wait
# WaitSurroundingTimeoutMs=50
# Experiment: shorter timeout (ms) used after two consecutive timeouts without a matching event
# WaitSurroundingShortMs=40
# Experiment: when the app's snapshot is frozen during deletion, stop waiting and re-probe once every N replacements
# WaitSurroundingProbeEvery=4
# Experiment: extra ms to wait after the deletion shows done, Messenger composer only
# WaitSurroundingSettleMs=40
# Experiment: select with Shift+Left and type over it in the Messenger composer
# MessengerSelectOvertype=True
# Experiment: in a field whose checks go unanswered, wait for its copy of the text again every few replacements
# CopyWaitRecovery=True
# Experiment: while replaying queued keys, change text not yet sent instead of deleting it
# FoldReplayReplacement=True
# Experiment: settle wait for the first word of a Messenger message (composer still loading)
# WaitSurroundingSettleFirstWordMs=60
# Experiment: a snapshot identical to the one at send time counts as done only after this many ms per backspace
# WaitSurroundingMinPerKeyMs=8
