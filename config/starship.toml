"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt with wallpaper-aware ANSI color capsules.
format = """
[╭─](bright-black)[](cyan)\
$os\
$username\
[](cyan) [](blue)\
$directory\
[](blue) \
$nodejs\
$bun\
$rust\
$golang\
$python\
$docker_context\
$line_break\
[╰─](bright-black)\
$character"""

right_format = "([](purple)$git_branch$git_status[](purple) )$status$cmd_duration$time"

# Giữ trống một dòng giữa các lệnh để thoáng mắt
add_newline = true

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[os]
disabled = false
style = "bold fg:black bg:cyan"
format = "[$symbol]($style)"

[os.symbols]
Arch = "󰣇 "
CachyOS = " "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Linux = "󰌽 "
Macos = "󰀵 "
Windows = "󰍲 "

[directory]
style = "bold fg:black bg:blue"
format = "[ 󰉋 $path]($style)[$read_only]($read_only_style)[ ]($style)"
truncation_length = 2
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bold fg:black bg:blue"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = "󰝚 Music"
"Pictures" = " Pictures"
"Projects" = "󰲋 Projects"
"Videos" = " Videos"

[git_branch]
truncation_length = 16
truncation_symbol = "…"
symbol = "  "
style = "bold fg:black bg:purple"
format = "[$symbol$branch]($style)"

[git_status]
style = "bold fg:black bg:purple"
format = "[$all_status$ahead_behind ]($style)"
conflicted = " !"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " "
stashed = " 󰏖"
modified = " "
staged = " 󰄬"
renamed = " 󰁕"
deleted = " 󰅖"

[nodejs]
symbol = "󰌆"
style = "green"
format = "[$symbol $version]($style) "

[bun]
symbol = "󰠳"
style = "red"
format = "[$symbol $version]($style) "

[rust]
symbol = "󱘗"
style = "red"
format = "[$symbol $version]($style) "

[golang]
symbol = "󰟓"
style = "blue"
format = "[$symbol $version]($style) "

[python]
symbol = "󰌠"
style = "yellow"
format = "[$symbol $version]($style) "

[docker_context]
symbol = "󰡨"
style = "blue"
format = "[$symbol $context]($style) "

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "[󱎫 $duration]($style) "

[time]
disabled = false
time_format = "%R"
style = "bright-white"
format = "[ $time]($style)"

[status]
disabled = false
style = "bold red"
format = "[󰅚 $status]($style) "

[username]
show_always = true
style_user = "bold fg:black bg:cyan"
style_root = "bold fg:red bg:cyan"
format = "[$user ]($style)"
