source = ~/.config/hypr/colors.conf

general {
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/current_wallpaper
    color = $surface

    # Blur & dim effect on current wallpaper
    blur_size = 6
    blur_passes = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours (Top line)
label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 180
    halign = center
    valign = center
}

# Minutes (Bottom line)
label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 40
    halign = center
    valign = center
}

# Day & Date (Day, DD Mon.)
label {
    monitor =
    text = cmd[update:60000] echo "<b><big> "$(date +'%A, %d %b.')" </big></b>"
    color = rgba(255, 255, 255, 0.8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 0
    shadow_size = 0

    position = 0, -50
    halign = center
    valign = center
}

# Password Input Field (Pill / Capsule shape with thin outline)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1

    rounding = 25
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff77">Password...</span></i>
    hide_input = false
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -130
    halign = center
    valign = center
}
