# ==============================================================================
# LƯU Ý QUAN TRỌNG / IMPORTANT NOTE:
# CachyOS Hyprland đang sử dụng backend Lua (~/.config/hypr/hyprland.lua).
# File .conf này KHÔNG ĐƯỢC LOAD bởi Hyprland!
#
# Toàn bộ cấu hình đã được đồng bộ vào các file Lua tương ứng:
# - Phím tắt Rofi & Hyprlock -> ~/.config/hypr/config/binds.lua
# - Autostart Hyprlock        -> ~/.config/hypr/config/autostart.lua
# - Layer rules cho Rofi      -> ~/.config/hypr/config/windowrules.lua
# ==============================================================================

# Hyprland configuration (Reference config for Bintang M setup)

$mainMod = SUPER

# App Launcher (Rofi)
bind = $mainMod, SPACE, exec, ~/.config/rofi/launchers/launcher.sh

# Lock Screen (Hyprlock)
bind = $mainMod, L, exec, hyprlock
exec-once = pgrep -x hyprlock >/dev/null || hyprlock

# Layer rules for Rofi blur
layerrule = blur, rofi
layerrule = ignorealpha 0.5, rofi
layerrule = dimaround, rofi
layerrule = animation popin 10%, rofi
