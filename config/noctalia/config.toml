[accessibility]
ui_scale = 1.20

[backdrop]
blur_intensity = 0.65
enabled = true
tint_intensity = 0.34

[bar.default]
 background_opacity = 0.0
 border = "outline"
 border_width = 0.0
capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.92
capsule_padding = 11.0
capsule_thickness = 0.86
center = [ "workspaces" ]
 compositor_blur = false
concave_edge_corners = false
 contact_shadow = false
end = [ "media", "tray", "group:status", "group:session_controls" ]
margin_edge = 12
margin_ends = 12
margin_opposite_edge = 2
padding = 8
position = "top"
radius = 19
radius_bottom_left = 19
radius_bottom_right = 19
radius_top_left = 19
radius_top_right = 19
scale = 1.00
 shadow = false
start = [ "launcher", "group:time" ]
thickness = 38
widget_spacing = 10
capsule_border = "outline"
capsule_border_width = 1.0

    [[bar.default.capsule_group]]
    border = "outline"
    fill = "surface_variant"
    id = "time"
        members = [ "clock", "calendar_date" ]
    opacity = 0.92
    padding = 11.0
    widget_spacing = 12

    [[bar.default.capsule_group]]
    border = "outline"
    fill = "surface_variant"
    id = "hardware"
    members = [ "temp", "sysmon_3" ]
    opacity = 0.92
    padding = 11.0
    widget_spacing = 12

    [[bar.default.capsule_group]]
    border = "outline"
    fill = "surface_variant"
    id = "status"
    members = [ "network", "volume", "battery" ]
    opacity = 0.92
    padding = 11.0
    widget_spacing = 12

[shell]
button_borders = true
card_borders = true
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
corner_radius_scale = 1.00
font_family = "Adwaita Sans"
input_borders = true
launch_apps_as_systemd_services = true
polkit_agent = true
popup_borders = true
popup_shadows = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    layout = "simple"
    search_position = "top"
    categories = true
    category_icons_only = true
    show_settings_button = true
    show_session_button = true
    track_usage = true
    sort_by_usage = true
    compact = true

    [shell.panel]
    borders = true
    border_color = "outline"
    border_width = 1.0
    control_center_placement = "floating"
    control_center_position = "top_center"
    floating_offset = 14
    list_item_background = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"
    shadow = true
    transparency_mode = "glass"

    [shell.shadow]
    alpha = 0.30
    direction = "down"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 30

[dock]
enabled = true
position = "bottom"
active_monitor_only = true
icon_size = 40
main_axis_padding = 12
cross_axis_padding = 7
item_spacing = 6
background_opacity = 0.92
border = "outline"
border_width = 1.0
radius = 24
concave_edge_corners = false
margin_ends = 12
margin_edge = 12
shadow = true
show_running = true
auto_hide = true
smart_auto_hide = false
layer = "overlay"
reserve_space = false
active_scale = 1.0
inactive_scale = 0.88
magnification = true
magnification_scale = 1.12
active_opacity = 1.0
inactive_opacity = 0.78
show_dots = true
show_instance_count = false
launcher_position = "start"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "media_main" ]

    [desktop_widgets.widget.media_main]
    type = "media_player"
    output = "eDP-1"
    cx = 260.0
    cy = 820.0
    box_width = 420.0
    box_height = 170.0
    rotation = 0.0
    flip_x = false
    flip_y = false

        [desktop_widgets.widget.media_main.settings]
        layout = "horizontal"
        color = "on_surface"
        shadow = true
        hide_when_no_media = true
        album_art_background = true
        album_art_blur = 32
        audio_visualizer = true
        background = true
        background_color = "surface"
        background_opacity = 0.92
        background_radius = 22.0
        background_padding = 14.0

[wallpaper]
directory = "~/Ảnh/Wallpaper"
edge_smoothness = 0.65
enabled = false
transition = [ "disc" ]
transition_duration = 1100

[theme]
mode = "dark"
source = "wallpaper"
matugen_palette = "matugen"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty", "hyprland" ]

[widget.clock]
color = "on_surface"
format = "{:%H:%M}"
font_weight = 600
font_scale = 1.08

[widget.launcher]
color = "on_primary"
icon_color = "on_primary"
capsule_fill = "primary"
capsule_opacity = 1.0
capsule_padding = 11.0

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"
max_length = 160.0
min_length = 64.0

[widget.network]
color = "on_surface_variant"

[widget.notifications]
color = "on_surface_variant"

[widget.session]
color = "on_surface_variant"

[widget.hotspot]
glyph = "antenna-bars-5"
interactive = true
tooltip = "Mobile Hotspot (Trái: Bật/Tắt | Phải: Menu)"
type = "custom_button"

    [widget.hotspot.actions]
    left = "exec ~/.local/bin/hotspot toggle"
    right = "exec ~/.local/bin/hotspot-menu"

[widget.showdesktop]
glyph = "device-desktop"
interactive = true
tooltip = "Show Desktop (an het cua so)"
type = "custom_button"

    [widget.showdesktop.actions]
    left = "exec ~/.local/bin/toggle-desktop"

[widget.spacer_1]
type = "spacer"

[widget.temp]
glyph = "temperature"
show_value = true
stat = "cpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "device-desktop-analytics"
show_value = true
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "surface_variant"

[widget.volume]
color = "on_surface_variant"

[widget.workspaces]
active_pill_size = 3.0
capsule = true
empty_color = "hover"
focused_color = "primary"
label_source = "id"
occupied_color = "secondary"
inactive_pill_size = 1.4
pill_scale = 1.0
show_labels = true
style = "regular"
urgent_color = "error"
font_weight = 600

[control_center]
width = 950
sidebar = "compact"
sidebar_section = "compact"
show_shortcut_labels = true

[notification]
background_opacity = 0.92
border = true
border_color = "outline"
width = 380
position = "top_right"
offset_x = 12
offset_y = 64
max_visible = 3
show_actions = true
show_app_name = true
border_width = 1.0

[osd]
background_opacity = 0.92
border = true
border_color = "outline"
position = "top_center"
offset_y = 64
orientation = "horizontal"
hide_delay_ms = 1300
border_width = 1.0

[lockscreen]
blur_intensity = 0.62
tint_intensity = 0.34
transition = [ "fade", "zoom" ]
transition_duration = 1000

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "mic_mute"

# Laptop power belongs on the bar; hardware details remain in Control Center.
[widget.battery]
type = "battery"
color = "on_surface_variant"

[hooks]
wallpaper_changed = ["python3 $HOME/.config/hypr/scripts/generate-theme.py --wallpaper-changed"]
theme_mode_changed = ["python3 $HOME/.config/hypr/scripts/generate-theme.py --theme-mode-changed"]

[plugins]
enabled = []

[widget.calendar_date]
type = "clock"
format = "{:%a · %d/%m}"
color = "on_surface_variant"
font_scale = 0.94


[[bar.default.capsule_group]]
id = "session_controls"
members = [ "notifications", "session" ]
fill = "surface_variant"
border = "outline"
opacity = 0.92
padding = 11.0
widget_spacing = 14
